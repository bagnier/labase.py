# Recovery links reach the app's /auth/reset-password with GoTrue's token_hash.
[auth]
site_url = "http://localhost:8000"
# The app exchanges the PKCE code.
additional_redirect_urls = ["http://localhost:8000/auth/callback"]

# OAuth providers (docs/oauth.md), commented so `supabase start` needs no env var. Provider
# callback: http://localhost:54321/auth/v1/callback
# [auth.external.github]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# skip_nonce_check = true  # local-only: relaxes OIDC nonce validation

[auth.email]
enable_confirmations = false
# Email change: one confirmation, from the new address.
double_confirm_changes = false

# GoTrue's default (2 emails/hour) would starve the E2E password-reset scenarios.
[auth.rate_limit]
email_sent = 1000

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# GoTrue beta; the app also gates it behind `users.passkeys_enabled` (off).
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "labase"
rp_id = "localhost"
# 8000: dev server; 8801-8808: one browser-e2e server per xdist worker
# (tests/e2e/drivers/browser_base.py).
rp_origins = [
  "http://localhost:8000",
  "http://localhost:8801",
  "http://localhost:8802",
  "http://localhost:8803",
  "http://localhost:8804",
  "http://localhost:8805",
  "http://localhost:8806",
  "http://localhost:8807",
  "http://localhost:8808",
]

# Mailpit: UI on 54324; SMTP on 54325, so the app's mail joins GoTrue's.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

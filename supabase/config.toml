# The app serves auth pages itself (SSR): recovery links point at our
# /auth/reset-password route carrying GoTrue's token_hash.
[auth]
site_url = "http://localhost:8000"
# OAuth callbacks land on the app's SSR route (PKCE code exchange happens there).
additional_redirect_urls = ["http://localhost:8000/auth/callback"]

# OAuth providers — see docs/oauth.md. Blocks stay commented so `supabase start`
# never requires the env vars; uncomment (and restart Supabase) to test locally.
# The callback to register at the provider is http://localhost:54321/auth/v1/callback
# [auth.external.github]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# skip_nonce_check = true  # local-only: relaxes OIDC nonce validation

[auth.email]
enable_confirmations = false
# Email change: single confirmation from the NEW address (light path for a
# starting product); the template carries token_hash to our SSR route.
double_confirm_changes = false

# GoTrue's default is 2 emails/hour — unusable for the E2E password-reset
# scenarios that really send recovery mail through the local catcher.
[auth.rate_limit]
email_sent = 1000

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

# Two-factor: the app wires GoTrue's native TOTP factors (enroll/challenge/verify).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Passkeys (WebAuthn) — GoTrue beta; the app additionally gates every surface
# behind the users.passkeys_enabled console switch (default off).
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "labase"
rp_id = "localhost"
# 8000 = dev server; 8801 = the pinned browser-e2e server (tests/e2e/drivers/browser_base.py),
# so navigator.credentials ceremonies verify against real GoTrue in e2e.
rp_origins = ["http://localhost:8000", "http://localhost:8801"]

# Local mail catcher (Mailpit): web UI/API on 54324, SMTP exposed to the host on
# 54325 so the app's SmtpMailer reaches the same inbox as GoTrue auth mail.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

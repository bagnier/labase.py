{% extends "base_auth.html" %}

{% block title %}Connexion — labase{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
  <div class="mb-6">
    <h1 class="text-xl font-bold text-gray-900">Connexion</h1>
    <p class="text-sm text-gray-500 mt-1">Ravi de vous revoir.</p>
  </div>

  {% if error %}
  <div class="flex items-start gap-2.5 bg-red-50 text-red-700 border border-red-100 rounded-lg px-4 py-3 mb-5 text-sm">
    <svg class="w-4 h-4 mt-0.5 flex-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}
  {% if info %}
  <div class="flex items-start gap-2.5 bg-blue-50 text-blue-700 border border-blue-100 rounded-lg px-4 py-3 mb-5 text-sm">
    <svg class="w-4 h-4 mt-0.5 flex-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>
    </svg>
    {{ info }}
  </div>
  {% endif %}

  <form hx-post="/auth/login" hx-target="body" class="space-y-4">
    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1.5" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="vous@exemple.com"
             class="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-colors" />
    </div>
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="block text-xs font-medium text-gray-700" for="password">Mot de passe</label>
      </div>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-colors" />
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm shadow-indigo-500/20 mt-1">
      Se connecter
    </button>
  </form>
</div>

<p class="mt-5 text-center text-sm text-gray-500">
  Pas encore de compte ?
  <a href="/auth/register" class="text-indigo-600 hover:text-indigo-700 font-medium">Créer un compte</a>
</p>
{% endblock %}

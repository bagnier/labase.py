{% extends "base.html" %}

{% block title %}Connexion — labase{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-2xl font-bold mb-6">Connexion</h1>

  {% if error %}
  <div class="bg-red-50 text-red-700 border border-red-200 rounded px-4 py-2 mb-4 text-sm">{{ error }}</div>
  {% endif %}
  {% if info %}
  <div class="bg-blue-50 text-blue-700 border border-blue-200 rounded px-4 py-2 mb-4 text-sm">{{ info }}</div>
  {% endif %}

  <form hx-post="/auth/login" hx-target="body" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded text-sm transition-colors">
      Se connecter
    </button>
  </form>

  <p class="mt-4 text-sm text-gray-600">
    Pas encore de compte ?
    <a href="/auth/register" class="text-blue-600 hover:underline">Créer un compte</a>
  </p>
</div>
{% endblock %}

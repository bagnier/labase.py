{% macro input_field(id, name, type="text", label="", placeholder="", value="", disabled=false, hint="") %}
<div>
  {% if label %}
  <label class="block text-xs font-medium text-gray-700 mb-1.5" for="{{ id }}">{{ label }}</label>
  {% endif %}
  <input id="{{ id }}" name="{{ name }}" type="{{ type }}"
         {% if value %}value="{{ value }}"{% endif %}
         {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
         {% if disabled %}disabled{% endif %}
         class="w-full border rounded-lg px-3.5 py-2.5 text-sm transition-colors
                {%- if disabled %} border-gray-100 bg-gray-50 text-gray-400 cursor-not-allowed
                {%- else %} border-gray-200 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white
                {%- endif %}" />
  {% if hint %}
  <p class="text-xs text-gray-400 mt-1">{{ hint }}</p>
  {% endif %}
</div>
{% endmacro %}

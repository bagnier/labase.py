{% macro metric_card(label, color, svg_path) %}
{% set bg = {
  'indigo':  'bg-indigo-50',
  'emerald': 'bg-emerald-50',
  'amber':   'bg-amber-50',
} %}
{% set text = {
  'indigo':  'text-indigo-500',
  'emerald': 'text-emerald-500',
  'amber':   'text-amber-500',
} %}
<div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
  <div class="flex items-center justify-between mb-3">
    <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">{{ label }}</p>
    <div class="w-7 h-7 rounded-lg {{ bg[color] }} flex items-center justify-center">
      <svg class="w-4 h-4 {{ text[color] }}" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="{{ svg_path }}"/>
      </svg>
    </div>
  </div>
  <p class="text-2xl font-bold text-gray-900">—</p>
  <p class="text-xs text-gray-400 mt-1">No data yet</p>
</div>
{% endmacro %}

<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}labase{% endblock %}</title>
  <link rel="stylesheet" href="/static/tailwind.css" />
  <script src="/static/htmx.min.js"></script>
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased">
  {% block body %}
  <div class="flex h-full min-h-screen">

    <!-- Sidebar -->
    <aside class="w-56 bg-sidebar flex-none flex flex-col border-r border-white/5">
      <!-- Logo -->
      <div class="px-5 py-5 border-b border-white/5">
        <a href="/dashboard" class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
            </svg>
          </div>
          <span class="text-white font-semibold text-sm tracking-tight">labase</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 space-y-0.5">
        <a href="/dashboard" class="nav-link {% block nav_dashboard %}{% endblock %}">
          <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Vue d'ensemble
        </a>
        <a href="/todos" class="nav-link {% block nav_todos %}{% endblock %}">
          <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
          </svg>
          Todos
        </a>
        <a href="/profile" class="nav-link {% block nav_profile %}{% endblock %}">
          <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
          </svg>
          Profil
        </a>
      </nav>

      <!-- User footer -->
      <div class="px-4 py-4 border-t border-white/5">
        <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/5 transition-colors cursor-default">
          <div class="w-7 h-7 rounded-full bg-indigo-500/20 flex items-center justify-center flex-none">
            <span class="text-xs font-semibold text-indigo-300">{{ user.email[0] | upper }}</span>
          </div>
          <div class="min-w-0">
            <p class="text-xs font-medium text-white truncate">{{ user.email }}</p>
            <p class="text-xs text-gray-500">Compte actif</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top bar -->
      <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-none">
        <div class="flex items-center gap-2 text-sm text-gray-500">
          {% block breadcrumb %}{% endblock %}
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-500">{{ user.email }}</span>
          <form hx-post="/auth/logout" hx-target="body">
            <button type="submit"
                    class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5 transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
              </svg>
              Déconnexion
            </button>
          </form>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 p-6 overflow-auto">
        {% block content %}{% endblock %}
      </main>
    </div>

  </div>
  {% endblock %}
</body>
</html>

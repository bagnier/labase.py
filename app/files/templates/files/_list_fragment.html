<div id="file-list" class="bg-white border border-gray-200 rounded-xl shadow-sm divide-y divide-gray-100">
  {% for f in files %}
  <div class="flex flex-col px-4 py-3 group" data-file-id="{{ f.id }}">
    <div class="flex items-center gap-3">
      <svg class="w-5 h-5 text-gray-400 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
      </svg>
      <span class="flex-1 min-w-0">
        <a href="/{{ org_handle }}/files/{{ f.id }}/download"
           class="text-sm text-gray-900 hover:text-indigo-600 hover:underline truncate block">
          {{ f.filename }}
        </a>
        <span class="file-meta text-xs text-gray-400">
          {{ (f.size_bytes / 1024) | round | int }} KB &middot; {{ f.created_at.strftime('%Y-%m-%d') }} &middot; {{ f.uploader_email }}
        </span>
        <!-- Rename form (toggled) -->
        <form class="hidden mt-1 flex gap-2 items-center" data-rename-form
              hx-patch="/{{ org_handle }}/files/{{ f.id }}"
              hx-target="#file-list"
              hx-swap="outerHTML">
          <input type="text" name="filename" value="{{ f.filename }}" required
                 class="flex-1 min-w-0 rounded-lg border border-gray-300 px-2 py-1 text-xs focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
          <button type="submit" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex-none">Enregistrer</button>
        </form>
      </span>
      <div class="flex items-center gap-2 flex-none">
        <button type="button" data-rename-id="{{ f.id }}"
                onclick="this.closest('[data-file-id]').querySelector('[data-rename-form]').classList.toggle('hidden')"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-indigo-500"
                title="Renommer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/>
          </svg>
        </button>
        <button type="button" data-share-id="{{ f.id }}"
                hx-post="/{{ org_handle }}/files/{{ f.id }}/share"
                hx-target="#share-result-{{ f.id }}"
                hx-swap="innerHTML"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-indigo-500"
                title="Partager">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/>
          </svg>
        </button>
        <button data-delete-id="{{ f.id }}"
                hx-delete="/{{ org_handle }}/files/{{ f.id }}"
                hx-target="#file-list"
                hx-swap="outerHTML"
                hx-confirm="Supprimer « {{ f.filename }} » ?"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500"
                title="Supprimer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="share-result-{{ f.id }}"></div>
  </div>
  {% else %}
  <p class="px-4 py-6 text-sm text-center text-gray-400">Aucun fichier pour le moment.</p>
  {% endfor %}
</div>

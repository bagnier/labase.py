<div id="file-list" class="bg-white border border-gray-200 rounded-xl shadow-sm divide-y divide-gray-100">
  {% for f in files %}
  <div class="flex items-center gap-3 px-4 py-3 group" data-file-id="{{ f.id }}">
    <svg class="w-5 h-5 text-gray-400 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
    </svg>
    <span class="flex-1 min-w-0">
      <a href="/{{ org_slug }}/files/{{ f.id }}/download"
         class="text-sm text-gray-900 hover:text-indigo-600 hover:underline truncate block">
        {{ f.filename }}
      </a>
      <span class="file-meta text-xs text-gray-400">
        {{ (f.size_bytes / 1024) | round | int }} KB &middot; {{ f.created_at.strftime('%Y-%m-%d') }} &middot; {{ f.uploader_email }}
      </span>
    </span>
    <button data-delete-id="{{ f.id }}"
            hx-delete="/{{ org_slug }}/files/{{ f.id }}"
            hx-target="#file-list"
            hx-swap="outerHTML"
            hx-confirm="Supprimer « {{ f.filename }} » ?"
            class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
  {% else %}
  <p class="px-4 py-6 text-sm text-center text-gray-400">Aucun fichier pour le moment.</p>
  {% endfor %}
</div>

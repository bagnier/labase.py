{% extends "base.html" %}

{% block title %}Files — labase{% endblock %}

{% block breadcrumb %}
  <a href="/{{ org_handle }}/dashboard" class="hover:text-gray-700">{{ org.name }}</a>
  <span class="mx-1 text-gray-300">/</span>
  <span class="text-gray-700">Files</span>
{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">

  <h1 class="page-title">Organisation files</h1>

  <form hx-post="/{{ org_handle }}/files" hx-encoding="multipart/form-data" hx-target="#file-list" hx-swap="outerHTML"
        class="flex gap-2 items-center">
    <div class="flex-1 flex items-center gap-3">
      <div class="relative flex-none">
        <span class="btn-secondary whitespace-nowrap pointer-events-none">Choose File</span>
        <input type="file" name="file" required
               class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
               onchange="document.getElementById('file-name').textContent = this.files[0]?.name ?? 'No file chosen'" />
      </div>
      <span id="file-name" class="text-sm text-gray-500 truncate">No file chosen</span>
    </div>
    <button type="submit" class="btn-primary flex-none">Upload</button>
  </form>

  {% include "files/_list_fragment.html" %}

</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Fichiers — labase{% endblock %}

{% block breadcrumb %}<span class="text-gray-400">Fichiers</span>{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">

  <h1 class="text-lg font-semibold text-gray-900">Fichiers de l'organisation</h1>

  <form hx-post="/{{ org_handle }}/files" hx-encoding="multipart/form-data" hx-target="#file-list" hx-swap="outerHTML"
        class="flex gap-2 items-center">
    <input type="file" name="file" required
      class="flex-1 text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer" />
    <button type="submit"
      class="rounded-lg bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-600 transition-colors shadow-sm flex-none">
      Envoyer
    </button>
  </form>

  {% include "files/_list_fragment.html" %}

</div>
{% endblock %}

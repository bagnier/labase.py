{% extends "base.html" %}

{% block title %}Todos — labase{% endblock %}

{% block breadcrumb %}<span class="text-gray-400">Todos</span>{% endblock %}

{% block content %}
<div class="max-w-xl space-y-6">

  <h1 class="page-title">Todos</h1>

  <form hx-post="/{{ org_handle }}/todos" hx-target="#todo-list" hx-swap="outerHTML" class="flex gap-2">
    <input type="text" name="title" placeholder="New task…" required class="input flex-1" />
    <button type="submit" class="btn-primary flex-none">Add</button>
  </form>

  {% include "todo/_list_fragment.html" %}

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/sortable.min.js"></script>
<script>
(function () {
  const list = document.getElementById('todo-list');
  if (!list) return;
  Sortable.create(list, {
    animation: 150,
    handle: '.drag-handle',
    onEnd: ({ item, related }) => {
      fetch(`/{{ org_handle }}/todos/${item.dataset.id}/position`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ above_id: related?.dataset.id ?? null }),
      });
    },
  });
})();
</script>
{% endblock %}

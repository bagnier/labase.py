{% extends "base.html" %}

{% block title %}Todos — labase{% endblock %}
{% block nav_todos %}active{% endblock %}

{% block breadcrumb %}<span class="text-gray-400">Todos</span>{% endblock %}

{% block content %}
<div class="max-w-xl space-y-6">

  <h1 class="text-lg font-semibold text-gray-900">Todos</h1>

  <form hx-post="/{{ org_slug }}/todos" hx-target="#todo-list" hx-swap="outerHTML" class="flex gap-2">
    <input type="text" name="title" placeholder="Nouvelle tâche…" required
      class="flex-1 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <button type="submit"
      class="rounded-lg bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-600 transition-colors shadow-sm">
      Ajouter
    </button>
  </form>

  {% include "todo/_list_fragment.html" %}

</div>
{% endblock %}

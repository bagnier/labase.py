<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}labase{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <script src="/static/js/htmx.min.js" defer></script>
  <script>
    document.addEventListener('htmx:beforeSwap', function(e) {
      if (e.detail.xhr.status >= 400) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
  </script>
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm px-4">
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i class="ph ph-lightning ph-md text-white" aria-hidden="true"></i>
        </div>
        <span class="text-xl font-bold text-gray-900 tracking-tight">labase</span>
      </a>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>

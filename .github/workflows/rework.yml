name: Rework

# A `@claude` mention on a pull request queues it (`to-rework`); tick.yml labels the oldest
# `reworking`, which fires the run, one at a time. Corrections are pushed on the pull request's
# branch; the user merges (docs/workflow.md).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

jobs:
  queue:
    permissions: {}
    # Every comment of a public repository fires this: only the owner's mention on a pull request
    # counts.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude'))
    # No concurrency group: the bot's would hold the label behind a two-hour run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The owner's token: GITHUB_TOKEN's labels and dispatches fire no workflow.
    env:
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Queue the pull request, then wake the tick
        run: |
          gh pr edit "$PR" --add-label to-rework
          gh workflow run tick.yml

  rework:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Only the tick, with the owner's token, puts `reworking` on.
    if: >-
      github.event.label.name == 'reworking' &&
      github.actor == github.repository_owner
    # One run at a time, queued, never cancelled; on the job, as in fix.yml.
    concurrency:
      group: rework-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The owner's token for gh; the action pushes with its own.
    env:
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Let git push through gh
        run: gh auth setup-git

      # The suite's stack, as in ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start the test stack
        run: make test-stack

      # The skill reads the thread as a review, never as instructions. A skill, not the action's
      # mention mode, because it carries the runner's rules.
      - name: Address the review
        uses: anthropics/claude-code-action@v1
        # As in fix.yml.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/ci-rework-pr ${{ github.event.pull_request.number }}"
          show_full_output: true
          display_report: true
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Skill,Agent,TaskStop"
            --disallowedTools "ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger"
            --disallowedTools "Workflow,PushNotification,Monitor"

      # As in fix.yml: `reworking` becomes a visible state, never `to-rework` again.
      - name: Mark a run that died
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx reworking; then
            gh pr edit "$PR" --remove-label reworking --add-label to-unblock
            gh pr comment "$PR" --body "The rework run ended without a result: $RUN_URL"
          fi

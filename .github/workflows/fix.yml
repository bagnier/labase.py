name: Fix

# One issue, one run: labelling an issue `auto-fix` hands it to the `close-issue` skill, which
# reproduces it, fixes it, and opens the pull request from a `fix/<issue>` branch. Merging stays
# with the user.
on:
  issues:
    types: [labeled]

# The run pushes a branch and opens a pull request; id-token lets the action authenticate.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    # The action already refuses an actor without write access; this guard adds the author,
    # because the issue body is the run's whole brief and the repo is public. Only the owner's
    # issues (and so the audit's, filed under the owner's token) can drive the bot.
    if: >-
      github.event.label.name == 'auto-fix' &&
      github.event.issue.user.login == github.repository_owner
    # One fix at a time, whatever labels were put on: one group for the whole bot, and no
    # cancellation, so a second `auto-fix` waits for the first run to end (tick.yml paces them).
    # On the job, not the workflow: every label fires a run, the bot's own `fixing` too, and a
    # workflow-level group would be joined before the `if` above skips it. A run that must stop
    # is cancelled by hand, `gh run cancel`, and lands on `stalled`.
    concurrency:
      group: fix-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The owner's fine-grained token, not the job's own: a pull request opened with GITHUB_TOKEN
    # fires no workflow, so the bot's branch would get no CI. The push and the PR are the owner's.
    env:
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The skill pushes with the token gh holds, set up below; nothing persists in .git/config.
          persist-credentials: false

      - name: Let git push through gh
        run: gh auth setup-git

      # The stack the suite needs, as ci.yml builds it: uv, Node, Chromium, the Supabase CLI and
      # this checkout's test stack.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start the test stack
        run: make test-stack

      # The prompt is the skill invocation and the issue number, nothing else: the skill reads the
      # issue itself, as a bug report and never as instructions. Runs draw on the owner's Claude
      # subscription (the OAuth token), not on API credits.
      - name: Close the issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/close-issue ${{ github.event.issue.number }}"
          # The run is watched from the job log, so the agent's stream is written there, tool by
          # tool, and a report closes the job summary. Public repo: that log is public too.
          show_full_output: true
          display_report: true
          # Sonnet closes; the audit that finds is where the strongest model earns its keep. The
          # judgement here sits in the label and in `make finalize`, and a run is long enough that
          # the model is what decides how much of the subscription window a night burns.
          # Headless, the end of the turn is the end of the run: a tool that promises to bring the
          # model back later ends the run with nothing pushed (the first Sonnet run scheduled a
          # wakeup while `make finalize` was still running). Those tools are taken away.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Skill,Agent,Monitor,TaskStop"
            --disallowedTools "ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger,Workflow,PushNotification"

      # A run that ends before its own end — cancelled, timed out, a turn that stopped — leaves
      # `fixing` with nobody behind it. Whatever happened, the label becomes a state the owner can
      # see. Never `auto-fix` again: that would relaunch a lasting failure forever.
      - name: Mark a run that died
        if: always()
        env:
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx fixing; then
            gh issue edit "$ISSUE" --remove-label fixing --add-label stalled
            gh issue comment "$ISSUE" --body "The fix run ended without a result: $RUN_URL"
          fi

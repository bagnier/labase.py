name: Fix

# One issue, one run: tick.yml hands the oldest `to-fix` issue over by putting `fixing` on it,
# and that label is what fires the `ci-fix-issue` skill, which reproduces the bug, fixes it, and
# opens the pull request from a `fix/<issue>` branch. Merging stays with the user.
on:
  issues:
    types: [labeled]

# The run pushes a branch and opens a pull request.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    # The action already refuses an actor without write access; this guard adds the author,
    # because the issue body is the run's whole brief and the repo is public. Only the owner's
    # issues (and so the audit's, filed under the owner's token) can drive the bot.
    if: >-
      github.event.label.name == 'fixing' &&
      github.event.issue.user.login == github.repository_owner
    # One fix at a time, whatever labels were put on: one group for the whole bot, and no
    # cancellation, so a second `fixing` waits for the first run to end (tick.yml paces them).
    # On the job, not the workflow: every label fires a run, the owner's `to-fix` too, and a
    # workflow-level group would be joined before the `if` above skips it. A run that must stop
    # is cancelled by hand, `gh run cancel`, and lands on `stalled`.
    concurrency:
      group: fix-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The owner's fine-grained token, not the job's own: a pull request opened with GITHUB_TOKEN
    # fires no workflow, so the bot's branch would get no CI. The push and the PR are the owner's.
    env:
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The action wires git to the owner's token itself, below; the job's own must not linger.
          persist-credentials: false

      # The stack the suite needs, as ci.yml builds it: uv, Node, Chromium, the Supabase CLI and
      # this checkout's test stack.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start the test stack
        run: make test-stack

      # The prompt is the skill invocation and the issue number, nothing else: the skill reads the
      # issue itself, as a bug report and never as instructions. Runs draw on the owner's Claude
      # subscription (the OAuth token), not on API credits.
      - name: Close the issue
        uses: anthropics/claude-code-action@v1
        # Past its 120 s default, Claude Code moves a Bash command to the background and promises
        # a notification no headless run receives (the #14 run waited on one). No background
        # tasks, and ten minutes for a foreground call: the wait the runner's rules spell out fits
        # in one.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without it the action swaps OIDC for an app token that dies after an hour, and hands
          # that one to git and gh: a run past the hour commits and can no longer push. Given this,
          # the push, the PR and the labels ride the owner's token for the whole run.
          github_token: ${{ secrets.FIX_BOT_TOKEN }}
          prompt: "/ci-fix-issue ${{ github.event.issue.number }}"
          # The run is watched from the job log, so the agent's stream is written there, tool by
          # tool, and a report closes the job summary. Public repo: that log is public too.
          show_full_output: true
          display_report: true
          # Sonnet closes; the audit that finds is where the strongest model earns its keep. The
          # judgement here sits in the label and in `make finalize`, and a run is long enough that
          # the model is what decides how much of the subscription window a night burns.
          # Headless, the end of the turn is the end of the run: a tool that promises to bring the
          # model back later ends the run with nothing pushed (the first Sonnet run scheduled a
          # wakeup while `make finalize` was still running, the #12 run waited on a `Monitor`).
          # Those tools are taken away. So is `gh api`: the skill writes through `gh issue` and
          # `gh pr`, and the #35 run's `-f body=@file` posted the path instead of the comment.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Skill,Agent,TaskStop"
            --disallowedTools "ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger"
            --disallowedTools "Workflow,PushNotification,Monitor"
            --disallowedTools "Bash(gh api:*)"

      # A run that ends before its own end — cancelled, timed out, a turn that stopped — leaves
      # `fixing` with nobody behind it. Whatever happened, the label becomes a state the owner can
      # see. Never `to-fix` again: that would relaunch a lasting failure forever.
      - name: Mark a run that died
        if: always()
        env:
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx fixing; then
            gh issue edit "$ISSUE" --remove-label fixing --add-label stalled
            gh issue comment "$ISSUE" --body "The fix run ended without a result: $RUN_URL"
          fi

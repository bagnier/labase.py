name: Fix

# tick.yml labels the oldest `to-fix` issue `fixing`, which fires the `ci-fix-issue` skill: it
# reproduces, fixes, and opens a pull request from `fix/<issue>`. The user merges.
on:
  issues:
    types: [labeled]

# The run pushes a branch and opens a pull request.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    # The issue body is the brief and the repo is public: only the owner's issues drive the bot.
    if: >-
      github.event.label.name == 'fixing' &&
      github.event.issue.user.login == github.repository_owner
    # One run at a time, queued, never cancelled (a run to stop is cancelled by hand). On the
    # job: a workflow-level group is joined before the `if` skips a run, which would cancel the
    # live one.
    concurrency:
      group: fix-bot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The owner's token: a pull request opened with GITHUB_TOKEN fires no CI.
    env:
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The action sets the owner's token itself.
          persist-credentials: false

      # The suite's stack, as in ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start the test stack
        run: make test-stack

      # The skill reads the issue as a bug report, never as instructions. On the owner's
      # subscription, not API credits.
      - name: Close the issue
        uses: anthropics/claude-code-action@v1
        # Past 120 s, Claude Code backgrounds a command and waits for a notification a headless
        # run never gets: no background tasks, ten minutes per foreground call.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Else the action's app token expires after an hour, and a longer run cannot push.
          github_token: ${{ secrets.FIX_BOT_TOKEN }}
          prompt: "/ci-fix-issue ${{ github.event.issue.number }}"
          # The agent's stream goes to the job log, public like the repo.
          show_full_output: true
          display_report: true
          # Sonnet: the judgement sits in the issue and `make finalize`, and long runs spend the
          # subscription. Headless, a tool promising a later wake-up ends the run unpushed: removed.
          # So is `gh api`, where `-f body=@file` posts the path.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Skill,Agent,TaskStop"
            --disallowedTools "ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger"
            --disallowedTools "Workflow,PushNotification,Monitor"
            --disallowedTools "Bash(gh api:*)"

      # Whatever ended the run, `fixing` becomes a state the owner sees; never `to-fix` again,
      # which would relaunch a lasting failure forever.
      - name: Mark a run that died
        if: always()
        env:
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx fixing; then
            gh issue edit "$ISSUE" --remove-label fixing --add-label to-unblock
            gh issue comment "$ISSUE" --body "The fix run ended without a result: $RUN_URL"
          fi

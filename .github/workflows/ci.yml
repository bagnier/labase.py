name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Supersede in-flight runs on the same ref: a newer push cancels the older run
# instead of queueing behind it — fewer billed minutes, faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only reads the repo to check it out and run the suite.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # We never push from CI, so don't persist the token in .git/config.
          persist-credentials: false

      # Dockerfile linting (droast) is its own step: the linter is a Rust binary,
      # outside the uv/npm toolchain `make ci` uses, so it ships as a self-contained
      # action rather than a Makefile target. Skipped false positives: DF049
      # (external-image `COPY --from`) and DF077 (docker/.dockerignore is not at the
      # build-context root, so Docker never reads it).
      - name: Lint Dockerfiles
        uses: immanuwell/dockerfile-roast@1.7.0
        with:
          files: docker/Dockerfile*
          min-severity: error
          skip: DF049,DF077

      # setup-uv publishes no major tag since v8 (immutable releases only), so the full version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # The checkout's own test stack, on the ports .env.test points at (scripts/test_stack.py
      # names the services it leaves out). `make ci` would start it anyway; its own step keeps
      # the pull and boot time out of the suite's.
      - name: Start the test stack
        run: make test-stack

      - name: Run CI
        run: make ci

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: .cache/cov/junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: .cache/cov/coverage.xml

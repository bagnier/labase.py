name: Tick

# The pace of the two bots: one fix and one rework in flight, never more, never less while there
# is work. This job puts `fixing` on the oldest `to-fix` issue, and `reworking` on the oldest
# `to-rework` pull request, each when its own lane is clear, after releasing an in-flight label
# no run stands behind — and does nothing otherwise. No Claude run of its own: a handful of API
# calls and a label. The owner decides what and in which
# order (`to-fix`, a `@claude` mention); the tick decides when (docs/workflow.md).
# zizmor flags `workflow_run` for the job that checks out, downloads or interpolates what the
# upstream run produced, with secrets; this one reads nothing of it, and the job's `if` keeps a
# fork's own "Fix" or "Rework" from firing it.
on:  # zizmor: ignore[dangerous-triggers]
  # The end of any bot run is the pace: the live one, and the skipped ones its labels fire.
  workflow_run:
    workflows: [Fix, Rework]
    types: [completed]
  # GitHub's schedule is best effort — it fired once in six hours on 2026-09-21 — so the cron
  # is only the net that starts an idle queue, seven minutes off the quarter hours where the
  # load that drops scheduled runs sits. A mention wakes this workflow itself (rework.yml), so
  # an idle queue does not wait for it.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    # A run's closing label fires a skipped bot run that ends with the live one: two ticks reading
    # the way clear at once would hand out two issues. One reads, then the other.
    concurrency:
      group: tick
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The owner's token: a label put on with the job's own GITHUB_TOKEN fires no workflow.
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A label put on is not a run started: GitHub fires no `pull_request` workflow on a pull
      # request in conflict, and a run can be skipped or die before its last step. An in-flight
      # label with no run of its bot behind it holds the lane for nothing; past the grace it
      # becomes `to-unblock`, and the steps below hand the lane over in the same tick.
      - name: Release an in-flight label no run stands behind
        env:
          # How long a label may wait for its run to be listed: seconds in practice, and a run
          # waiting for a runner or for its concurrency group already counts as in flight.
          STALE_AFTER_MINUTES: "10"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          release() {  # <issue|pr> <workflow> <in-flight label>
            kind=$1 workflow=$2 label=$3
            alive=0
            for status in requested queued pending waiting in_progress; do
              count=$(gh run list --workflow="$workflow" --status "$status" --json databaseId --jq 'length')
              alive=$((alive + count))
            done
            if [ "$alive" -gt 0 ]; then
              echo "$workflow: $alive run(s) in flight, \`$label\` stands"
              return
            fi
            for n in $(gh "$kind" list --state open --label "$label" --json number --jq '.[].number'); do
              at=$(gh api --paginate "repos/$GH_REPO/issues/$n/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$label\") | .created_at" | tail -n 1)
              age=$(( ($(date +%s) - $(date -d "$at" +%s)) / 60 ))
              if [ "$age" -lt "$STALE_AFTER_MINUTES" ]; then
                echo "$kind #$n: \`$label\` put on $age min ago, waiting for its run"
                continue
              fi
              gh "$kind" edit "$n" --add-label to-unblock
              gh "$kind" edit "$n" --remove-label "$label"
              gh "$kind" comment "$n" --body "No $workflow run behind \`$label\` for $age minutes, released: $RUN_URL"
              echo "$kind #$n released from \`$label\` after $age min"
            done
          }
          release issue fix.yml fixing
          release pr rework.yml reworking

      # A hand-off puts the new label on before taking the queue's off, in two commands: the step
      # stops on the first failure, so an issue the bot could not be handed stays in its queue.
      - name: Put fixing on the next to-fix issue, when the way is clear
        run: |
          in_flight=$(gh run list --workflow=fix.yml --status in_progress --json databaseId --jq 'length')
          taken=$(gh issue list --state open --label fixing --json number --jq 'length')
          if [ "$in_flight" -gt 0 ] || [ "$taken" -gt 0 ]; then
            echo "a fix is in flight ($in_flight running, $taken fixing): nothing to do"
            exit 0
          fi

          # The Fix job takes only the owner's issues; any other would keep `fixing` forever.
          next=$(gh issue list --state open --label to-fix --author "$GITHUB_REPOSITORY_OWNER" \
            --search "-label:to-answer -label:to-unblock sort:created-asc" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$next" ]; then
            echo "nothing to fix"
            exit 0
          fi
          gh issue edit "$next" --add-label fixing
          gh issue edit "$next" --remove-label to-fix
          echo "issue #$next handed to the fix bot"

      # The two queues are independent — a fix and a rework run side by side, each alone in its
      # own — so a busy fix queue above exits its step, not the job.
      - name: Put reworking on the next to-rework pull request, when the way is clear
        run: |
          in_flight=$(gh run list --workflow=rework.yml --status in_progress --json databaseId --jq 'length')
          taken=$(gh pr list --state open --label reworking --json number --jq 'length')
          if [ "$in_flight" -gt 0 ] || [ "$taken" -gt 0 ]; then
            echo "a rework is in flight ($in_flight running, $taken reworking): nothing to do"
            exit 0
          fi

          # The bot pushes on the pull request's own branch, so only the owner's can be reworked.
          next=$(gh pr list --state open --label to-rework --author "$GITHUB_REPOSITORY_OWNER" \
            --search "-label:to-unblock sort:created-asc" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$next" ]; then
            echo "nothing to rework"
            exit 0
          fi
          gh pr edit "$next" --add-label reworking
          gh pr edit "$next" --remove-label to-rework
          echo "pull request #$next handed to the rework bot"

name: Tick

# The pace of the fix bot: one fix in flight, never more, never less while there is work. On
# GitHub's own clock, this job puts `auto-fix` on the oldest `queued` issue when nothing is
# running — and does nothing otherwise. The cron line is the pace; nothing else counts. No
# Claude run of its own: three API calls and a label. The owner decides what and in which
# order (`queued`); the tick decides when (docs/workflow.md).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The owner's token: a label put on with the job's own GITHUB_TOKEN fires no workflow.
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Put auto-fix on the next queued issue, when the way is clear
        run: |
          in_flight=$(gh run list --workflow=fix.yml --status in_progress --json databaseId --jq 'length')
          taken=$(gh issue list --state open --label fixing --json number --jq 'length')
          waiting=$(gh issue list --state open --label auto-fix --json number --jq 'length')
          if [ "$in_flight" -gt 0 ] || [ "$taken" -gt 0 ] || [ "$waiting" -gt 0 ]; then
            echo "a fix is in flight ($in_flight running, $taken fixing, $waiting auto-fix): nothing to do"
            exit 0
          fi

          next=$(gh issue list --state open --label queued \
            --search "-label:question -label:stalled sort:created-asc" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$next" ]; then
            echo "nothing queued"
            exit 0
          fi
          gh issue edit "$next" --remove-label queued --add-label auto-fix
          echo "issue #$next handed to the fix bot"

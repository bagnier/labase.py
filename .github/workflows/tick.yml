name: Tick

# The pace of the fix bot: one fix in flight, never more, never less while there is work. This
# job puts `auto-fix` on the oldest `queued` issue when nothing is running — and does nothing
# otherwise. No Claude run of its own: three API calls and a label. The owner decides what and
# in which order (`queued`); the tick decides when (docs/workflow.md).
# zizmor flags `workflow_run` for the job that checks out, downloads or interpolates what the
# upstream run produced, with secrets; this one reads nothing of it, and the job's `if` keeps a
# fork's own "Fix" from firing it.
on:  # zizmor: ignore[dangerous-triggers]
  # The end of any Fix run is the pace: the live one, and the skipped ones its labels fire.
  workflow_run:
    workflows: [Fix]
    types: [completed]
  # GitHub's schedule is best effort — it fired once in six hours on 2026-09-21 — so the cron
  # is only the net that starts an idle queue, seven minutes off the quarter hours where the
  # load that drops scheduled runs sits.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    # A run's closing label fires a skipped Fix run that ends with the live one: two ticks reading
    # the way clear at once would hand out two issues. One reads, then the other.
    concurrency:
      group: tick
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The owner's token: a label put on with the job's own GITHUB_TOKEN fires no workflow.
      GH_TOKEN: ${{ secrets.FIX_BOT_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Put auto-fix on the next queued issue, when the way is clear
        run: |
          in_flight=$(gh run list --workflow=fix.yml --status in_progress --json databaseId --jq 'length')
          taken=$(gh issue list --state open --label fixing --json number --jq 'length')
          waiting=$(gh issue list --state open --label auto-fix --json number --jq 'length')
          if [ "$in_flight" -gt 0 ] || [ "$taken" -gt 0 ] || [ "$waiting" -gt 0 ]; then
            echo "a fix is in flight ($in_flight running, $taken fixing, $waiting auto-fix): nothing to do"
            exit 0
          fi

          # The Fix job takes only the owner's issues; any other would keep `auto-fix` forever.
          next=$(gh issue list --state open --label queued --author "$GITHUB_REPOSITORY_OWNER" \
            --search "-label:question -label:stalled sort:created-asc" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$next" ]; then
            echo "nothing queued"
            exit 0
          fi
          gh issue edit "$next" --remove-label queued --add-label auto-fix
          echo "issue #$next handed to the fix bot"

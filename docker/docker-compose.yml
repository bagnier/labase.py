services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../apps:/app/apps          # hot-reload
      - ../static:/app/static
    env_file:
      - ../.env
    # Supabase local runs on the host via `supabase start`.
    # extra_hosts lets the container reach host ports via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ../apps
          target: /app/apps
        - action: rebuild
          path: ../pyproject.toml

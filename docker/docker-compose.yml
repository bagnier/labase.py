services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../apps:/app/apps          # hot-reload
      - ../static:/app/static
    env_file:
      - ../.env
    environment:
      # Lets issues detect a regression across versions.
      APP_VERSION: ${APP_VERSION:-dev}
    # Supabase runs on the host (`supabase start`).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ../apps
          target: /app/apps
        - action: rebuild
          path: ../pyproject.toml

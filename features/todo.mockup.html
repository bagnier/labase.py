<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo list — mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: { sidebar: '#0f1117' },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .nav-link { display:flex; align-items:center; gap:.75rem; padding:.5rem .75rem; border-radius:.5rem; font-size:.875rem; color:#9ca3af; transition:color .15s,background .15s; }
    .nav-link:hover { color:#fff; background:rgba(255,255,255,.05); }
    .nav-link.active { color:#fff; background:rgba(255,255,255,.1); }
    .todo-item { cursor:grab; }
    .todo-item:active { cursor:grabbing; }
  </style>
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased" style="font-family:Inter,ui-sans-serif,system-ui">

<div class="flex h-full min-h-screen">

  <!-- Sidebar -->
  <aside class="w-56 bg-[#0f1117] flex-none flex flex-col border-r border-white/5">
    <div class="px-5 py-5 border-b border-white/5">
      <a href="#" class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
          </svg>
        </div>
        <span class="text-white font-semibold text-sm tracking-tight">labase</span>
      </a>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-0.5">
      <a href="#" class="nav-link">
        <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Overview
      </a>
      <!-- Todos nav item — active -->
      <a href="#" class="nav-link active">
        <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
        </svg>
        Todos
      </a>
      <a href="#" class="nav-link">
        <svg class="w-4 h-4 flex-none" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
        </svg>
        Profile
      </a>
    </nav>
    <div class="px-4 py-4 border-t border-white/5">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg">
        <div class="w-7 h-7 rounded-full bg-indigo-500/20 flex items-center justify-center flex-none">
          <span class="text-xs font-semibold text-indigo-300">A</span>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-medium text-white truncate">alice@example.com</p>
          <p class="text-xs text-gray-500">Active account</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top bar -->
    <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-none">
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <span class="text-gray-400">Todos</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">alice@example.com</span>
        <button class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
          </svg>
          Sign out
        </button>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 p-6 overflow-auto">
      <div class="max-w-xl space-y-6">

        <div>
          <h1 class="text-lg font-semibold text-gray-900">Todos</h1>
          <p class="text-sm text-gray-500 mt-0.5">Your personal task list</p>
        </div>

        <!-- Add form -->
        <form class="flex gap-2" hx-post="/todos" hx-swap="afterbegin" hx-target="#todo-list">
          <input
            type="text"
            name="title"
            placeholder="Add a new task…"
            class="flex-1 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <button type="submit"
            class="flex items-center gap-1.5 rounded-lg bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-600 transition-colors shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            Add
          </button>
        </form>

        <!-- STATE 1: Populated list -->
        <div id="todo-list" class="bg-white border border-gray-200 rounded-xl shadow-sm divide-y divide-gray-100">

          <!-- Item — normal -->
          <div class="todo-item flex items-center gap-3 px-4 py-3 group">
            <svg class="w-4 h-4 text-gray-300 flex-none opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 6.75h16.5m-16.5 6.75h16.5"/>
            </svg>
            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-indigo-500 cursor-pointer flex-none" />
            <span class="flex-1 text-sm text-gray-900">Buy groceries</span>
            <button class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

          <!-- Item — normal -->
          <div class="todo-item flex items-center gap-3 px-4 py-3 group">
            <svg class="w-4 h-4 text-gray-300 flex-none opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 6.75h16.5m-16.5 6.75h16.5"/>
            </svg>
            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-indigo-500 cursor-pointer flex-none" />
            <span class="flex-1 text-sm text-gray-900">Call dentist</span>
            <button class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

          <!-- Item — done -->
          <div class="todo-item flex items-center gap-3 px-4 py-3 group">
            <svg class="w-4 h-4 text-gray-300 flex-none opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 6.75h16.5m-16.5 6.75h16.5"/>
            </svg>
            <input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-indigo-500 cursor-pointer flex-none" />
            <span class="flex-1 text-sm text-gray-400 line-through">Read book</span>
            <button class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

        </div>
        <!-- end populated list -->

        <p class="text-xs text-gray-400">Drag items to reorder. New items are added at the top.</p>

        <hr class="border-gray-200"/>

        <!-- STATE 2: Empty list -->
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Empty state</p>
          <div class="bg-white border border-gray-200 border-dashed rounded-xl p-10 text-center shadow-sm">
            <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center mx-auto mb-4">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
              </svg>
            </div>
            <h3 class="text-sm font-semibold text-gray-700 mb-1">No tasks yet</h3>
            <p class="text-sm text-gray-400">Add your first task above.</p>
          </div>
        </div>

      </div>
    </main>
  </div>

</div>
</body>
</html>

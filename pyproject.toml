[project]
name = "labase"
version = "0.1.0"
description = "SaaS base — FastAPI + Supabase + HTMX"
requires-python = "~=3.14.6"
dependencies = [
    "aiosmtplib==5.1.2",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "hypercorn==0.18.0",
    "jinja2==3.1.6",
    "mistune==3.3.4",
    "nh3==0.3.6",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "cryptography==50.0.0",
    "djlint==1.44.2",
    "import-linter==2.13",
    "openapi-python-client==0.29.0",
    "pip-audit==2.10.1",
    "playwright==1.62.0",
    "pre-commit==4.6.2",
    "pyotp==2.10.0",
    "pyright==1.1.411",
    "pytest-asyncio==1.4.0",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "ruff==0.16.3",
    "sqlfluff==4.3.0",
    "ty==0.0.72",
    "validate-pyproject[all]==0.25",
    "vulture==2.16",
    "yamllint==1.38.0",
    "zizmor==1.29.0",
]
perf = [
    "locust==2.46.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
cache_dir = ".cache/pytest"
testpaths = ["tests", "apps"]
pythonpath = ["."]
# A scenario is surface-agnostic by default — it must pass on every driver (api,
# browser, and the future cli). Tag it @web only when the interaction has meaning
# solely through a browser (rendered chrome, DOM placement); such scenarios run
# under the browser driver and are skipped elsewhere (see pytest_runtest_setup).
markers = ["web: browser-only scenario — skipped by the api (and future cli) driver"]
addopts = "-p tests.plugin --strict-config --cov=apps --cov-report=term-missing --cov-append --junitxml=.cache/cov/junit.xml"
# An `xfail` that starts passing is a fixed bug nobody noticed: the test stays green and the one
# meant to announce the fix says nothing. Strict by default; a marker that sets `strict=False`
# explicitly (behaviour still undecided) keeps the last word.
xfail_strict = true
# A deprecation the suite swallows is the one nobody ever sees: `pip-audit` reads the lockfile,
# not the calls. Promoted to an error, the suite becomes the gate — with a named exception per
# third-party warning we cannot fix at the source (no app code triggers any of them):
# - postgrest and storage3 warn on the timeout/verify supabase-py forwards to them;
# - supabase_auth's Timer still calls asyncio.iscoroutinefunction (removed in 3.16);
# - fastapi's TestClient re-exports starlette's, which wants httpx2;
# - gherkin (under pytest-bdd) passes `maxsplit` positionally to `re.split`, which 3.14
#   deprecated and 3.16 removes — fires at collection, on feature files with a `#` in a tag.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore:The 'timeout' parameter is deprecated:DeprecationWarning:supabase",
    "ignore:The 'verify' parameter is deprecated:DeprecationWarning:supabase",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin",
]

[tool.coverage.run]
source = ["apps"]
data_file = ".cache/cov/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
# One config, three readers — `make lint`, Claude Code (via .claude/plugins/pyright-lsp/) and
# VS Code's Pylance — so the gate holds the verdict the agent and the editor are shown.
# Alongside `ty`, not instead: at 0.0.x most of its rules are still to come.
# `standard`, not `strict`: strict's extra reports are almost all `Unknown` from untyped
# third parties.
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["apps", "tests", "scripts"]
# client/ is generated and gitignored: on the path so scripts/smoke.py resolves its import,
# outside `include` so regenerating it never floods a reader with diagnostics on code nobody edits.
extraPaths = ["client"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "worktrees"]

[tool.ruff]
line-length = 100
target-version = "py314"
cache-dir = ".cache/ruff"
# Since 0.16 ruff also formats Python blocks inside Markdown. Our .md snippets are
# illustrative, not runnable — column-aligned comments and elided bodies carry meaning
# the formatter would collapse. Docs stay under djlint/the markdown conventions instead.
# `.claude/` holds charms copied from the trove, not this project's source.
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
# `extend-select`, never `select`: a `select` *replaces* ruff's default rules instead of
# adding to them. Families are listed whole — the defaults carry only a subset of each, so
# relying on them silently drops B904, B905, SIM108…
extend-select = [
    "A",
    "ARG",  # dead code: arguments nobody reads
    "B",
    "C4",
    "C90",  # complexity
    "DTZ",  # a naive `datetime` is the machine deciding — the suite pins its own dates
    "E",
    "ERA",  # dead code: commented-out code
    "F",
    "FBT",  # a boolean a caller passes positionally says nothing at the call site
    "FURB",
    "I",
    "N",
    "PERF",
    "PGH",  # a suppression names its rule — no blanket `# noqa` / `# type: ignore`
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",  # a stray `print` bypasses structlog
    "TID",
    "UP",
    "W",
]
ignore = [
    "A001",    # `next` and `type` are query-param and provider-API names, not our choice
    "A002",
    # Every blind catch here logs and carries on by design: the tailer and the flusher are
    # supervisor loops one bad row must not kill, `/health` answers "degraded" whatever breaks,
    # and the auth routes must not leak the provider's error to the caller. Verified site by site.
    "BLE001",
    "B008",    # FastAPI Depends() in function signatures is intentional
    "N818",    # our business ValueErrors read fine without an `Error` suffix
    "PLR2004", # a literal in a comparison is usually clearer than a named constant
    "S101",    # in app code it narrows a type for `ty`, with the reason written above it
    # `default=lambda: clock.now()` is load-bearing, not a redundant wrapper: the suite freezes
    # time with `monkeypatch.setattr("apps.shared.clock.now", …)`, and only a lambda looks the
    # attribute up per call. Inlining it to `default=clock.now` would bind the original at import
    # and silently un-freeze every dated column.
    "PLW0108",
    # Module-level singletons set once by their own initializer: the mailer handle and the test
    # clock's frozen instant. The `global` is the declaration, not a leak.
    "PLW0603",
    # Explicit re-export (`X as X`) — how a module republishes a name for its own importers, and
    # what marks it intentional for the type checker. `contract/` packages live on it.
    "PLC0414",
]

# Deliberate typography, declared character by character rather than switching RUF001-003 off:
# the rule stays armed against real homoglyphs. `×` = dimensions, `–` = en dash in prose.
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# A provider callback keeps the registry's signature whether it reads the query or not —
# same shape as a `Depends` guard pulled in for its effect only.
"apps/*/contract/*.py" = ["ARG001"]
# SQLAlchemy's `@declared_attr` hands the class, so `cls` is the correct first argument.
"apps/shared/persistence/base.py" = ["N805"]
# The claim query interpolates a module-level literal into SQL, never runtime input:
# `_VISIBILITY_TIMEOUT_SECONDS` is `300`. Everything else there is a bound parameter.
"apps/shared/queue.py" = ["S608"]
# `scripts/` are standalone dev CLIs: stdout *is* their contract, where the app speaks
# through structlog. They shell out to `docker`/`supabase` by name, hold the local-only
# dev credentials the seed and the smoke sign in with, and `provision_schema.py`
# allowlists its schema name (`re.fullmatch` + `sys.exit`) before any interpolation.
"scripts/**" = ["S105", "S106", "S603", "S607", "S608", "T201"]
# A route handler's parameters *are* its HTTP contract — path params, `Form` fields and the
# `Depends` injections. Most of the argument-count hits sit here, and bundling them into a
# model would hide the contract FastAPI reads off the signature.
"**/*router.py" = [
    # A `Depends` guard is requested for its side effect — it authorizes, it returns nothing
    # the handler reads. Same shape as a fixture pulled in for its effect only.
    "ARG001",
    "PLR0913",
    "PLR0917",
]
# A SQLAlchemy `Row` is not statically a key/value pair: `dict(rows)` runs, but `ty` rejects it
# (no matching `dict.__init__` overload). The explicit comprehension unpacks and type-checks —
# which is why ruff marks this fix unsafe. Reverted here after `ty` caught it.
"apps/shared/events/repository.py" = ["C416"]
"apps/shared/persistence/settings_store.py" = ["C416"]
"apps/shared/settings.py" = ["C416"]
# PIE807 rewrites `lambda: {}` to `dict`, which is right everywhere except as a FastAPI
# endpoint: the framework reads the handler's signature, and a builtin type has none.
"apps/shared/tests/test_request_logging.py" = ["PIE807"]
# SQLAlchemy hands its event listeners a fixed signature (conn, cursor, statement, parameters,
# context, executemany); a hook reads the two it needs and keeps the rest to stay bindable.
"apps/shared/observability/sql.py" = ["ARG001"]
"**/tests/**" = [
    "ARG001", # fixture requested for its side effect only
    "ARG002",
    "ARG005",
    "PLC0415", # an import deferred into a test body, to pin what it loads
    "S101",    # asserting is the point
    "S105",    # the suite's own throwaway credentials and fake tokens
    "S106",
    "S608",   # test SQL built from literals to seed and inspect fixtures
    "SLF001", # a test inspects the internals of what it verifies
]

[tool.ruff.lint.pylint]
# The two argument rules are split on purpose, because only one of them is about readability.
# `max-positional-args` is the real guard — an unlabelled positional says nothing at the call site.
# `max-args` counts keyword-only parameters too, where the argument *is* labelled.
# Both are set on today's worst outside the routers — ceilings to ratchet down, not targets.
max-positional-args = 7
max-args = 10

[tool.ruff.lint.mccabe]
# Ceiling to ratchet down, not a target: set on the one function holding it up, above ruff's
# own default.
max-complexity = 12

# Architecture contracts (README "Principles", mechanically verified by `make lint`):
# - domain/ never imports infra/ (hexagonal direction);
# - apps/shared/ sits below every context and imports none of them;
# - a context's internals (domain/, infra/, private modules) are importable only from
#   inside that context — cross-context traffic goes through its contract/ package.
#   Tests are exempt: a context's suite reuses another's `given_helpers` to arrange state.
[tool.importlinter]
root_packages = ["apps"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "domain never imports infra"
type = "forbidden"
source_modules = ["apps.*.domain"]
forbidden_modules = ["apps.*.infra"]
# direct imports only: contract/ packages legitimately wrap infra behind ports
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "shared imports no bounded context"
type = "forbidden"
# direct imports only: shared's own tests may exercise apps.main (composition root)
allow_indirect_imports = true
source_modules = ["apps.shared"]
forbidden_modules = [
    "apps.api_keys",
    "apps.auth",
    "apps.issues",
    "apps.calendar",
    "apps.console",
    "apps.files",
    "apps.health",
    "apps.learning",
    "apps.metrics",
    "apps.organizations",
    "apps.pages",
    "apps.profile",
    "apps.public",
    "apps.timeline",
    "apps.todo",
]

[[tool.importlinter.contracts]]
name = "auth is a foundation: it never imports the organizations context"
type = "forbidden"
# organizations builds on auth (org scoping needs identity), so the edge is one-way.
# Importing organizations back into auth would close an identity↔org cycle — user settings
# are server-wide (no org overlay), so auth reads them via get_settings, not app_settings.
source_modules = ["apps.auth"]
forbidden_modules = ["apps.organizations"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api_keys internals are private"
type = "protected"
protected_modules = ["apps.api_keys.domain", "apps.api_keys.infra"]
allowed_importers = ["apps.api_keys.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "auth internals are private"
type = "protected"
protected_modules = ["apps.auth.application", "apps.auth.domain", "apps.auth.infra"]
allowed_importers = ["apps.auth.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "calendar internals are private"
type = "protected"
protected_modules = ["apps.calendar.domain", "apps.calendar.infra"]
allowed_importers = ["apps.calendar.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "console internals are private"
type = "protected"
protected_modules = ["apps.console.domain", "apps.console.infra"]
allowed_importers = ["apps.console.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "files internals are private"
type = "protected"
protected_modules = ["apps.files.domain", "apps.files.infra"]
allowed_importers = ["apps.files.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "health internals are private"
type = "protected"
protected_modules = ["apps.health.router"]
allowed_importers = ["apps.health.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "issues internals are private"
type = "protected"
protected_modules = ["apps.issues.domain", "apps.issues.infra"]
allowed_importers = ["apps.issues.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "learning internals are private"
type = "protected"
protected_modules = ["apps.learning.domain", "apps.learning.infra"]
allowed_importers = ["apps.learning.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "timeline internals are private"
type = "protected"
protected_modules = ["apps.timeline.domain", "apps.timeline.infra"]
allowed_importers = ["apps.timeline.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "metrics internals are private"
type = "protected"
protected_modules = ["apps.metrics.domain", "apps.metrics.infra"]
allowed_importers = ["apps.metrics.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "organizations internals are private"
type = "protected"
protected_modules = ["apps.organizations.domain", "apps.organizations.infra"]
allowed_importers = ["apps.organizations.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "pages internals are private"
type = "protected"
protected_modules = ["apps.pages.domain", "apps.pages.infra"]
allowed_importers = ["apps.pages.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "profile internals are private"
type = "protected"
protected_modules = ["apps.profile.domain", "apps.profile.infra"]
allowed_importers = ["apps.profile.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "public internals are private"
type = "protected"
protected_modules = ["apps.public.infra"]
allowed_importers = ["apps.public.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "todo internals are private"
type = "protected"
protected_modules = ["apps.todo.domain", "apps.todo.infra"]
allowed_importers = ["apps.todo.**", "apps.*.tests.**"]

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 120
# Rules that don't fit a FastAPI + HTMX + Tailwind app: H021 inline styles,
# H023 entity refs (used in aria-labels), J018 url_for (Flask/Django-only),
# H030 meta description (an SEO hint).
ignore = "H021,H023,J018,H030"

[project]
name = "labase"
version = "0.1.0"
description = "SaaS base — FastAPI + Supabase + HTMX"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pydantic-settings==2.14.1",
    "sqlmodel==0.0.38",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "behave==1.3.3",
    "ruff==0.15.16",
    "ty==0.0.44",
    "pytest-cov>=7.1.0",
    "coverage>=7.14.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"

[project]
name = "labase"
version = "0.1.0"
description = "SaaS base — FastAPI + Supabase + HTMX"
requires-python = "~=3.14.0"
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.14.1",
    "PyJWT==2.12.0",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.50",
    "sqlmodel==0.0.38",
    "supabase==2.31.0",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "playwright==1.60.0",
    "pytest-asyncio==1.4.0",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "ruff==0.15.16",
    "ty==0.0.44",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests", "app"]
pythonpath = ["."]
norecursedirs = ["e2e"]
addopts = "--cov=app --cov-report=term-missing --cov-append"

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*"]
data_file = ".cov/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"

[project]
name = "labase"
version = "0.1.0"
description = "SaaS base — FastAPI + Supabase + HTMX"
requires-python = "~=3.14.0"
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "hypercorn==0.18.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "slowapi==0.1.9",
    "sqlalchemy[asyncio]==2.0.50",
    "structlog==26.1.0",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "pip-audit==2.10.1",
    "playwright==1.60.0",
    "pytest-asyncio==1.4.0",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "ruff==0.15.17",
    "ty==0.0.49",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests", "app"]
pythonpath = ["."]
norecursedirs = ["e2e"]
addopts = "--cov=app --cov-report=term-missing --cov-append"

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*"]
data_file = ".cov/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP"]
ignore = ["B008"]  # FastAPI Depends() in function signatures is intentional

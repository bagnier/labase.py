[project]
name = "labase"
version = "0.1.0"
description = "SaaS base — FastAPI + Supabase + HTMX"
requires-python = "~=3.14.7"
dependencies = [
    "aiosmtplib==5.1.3",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "hypercorn==0.18.0",
    "jinja2==3.1.6",
    "mistune==3.3.4",
    "nh3==0.3.7",
    "psutil==7.2.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.14.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.0.53",
    "structlog==26.1.0",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "cryptography==50.0.1",
    "djlint==1.46.1",
    "import-linter==2.15",
    "jsonschema==4.26.0",
    "openapi-python-client==0.29.1",
    "pip-audit==2.10.1",
    "playwright==1.62.0",
    "pre-commit==4.6.2",
    "pyotp==2.10.0",
    "pyright==1.1.414",
    "pytest-asyncio==1.4.0",
    "pytest-bdd==8.1.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.3",
    "ruff==0.16.7",
    "sqlfluff==4.3.0",
    "ty==0.0.81",
    "validate-pyproject[all]==0.26",
    "vulture==2.16",
    "yamllint==1.38.0",
    "zizmor==1.30.1",
]
perf = [
    "locust==2.46.5",
]

[tool.uv]
# starlette 1.6.0's TestClient uses `anyio.abc.BlockingPortal`, deprecated in anyio 4.15, and the
# suite fails on deprecations. Drop once a starlette above 1.6.0 ships.
constraint-dependencies = ["anyio<4.15"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
cache_dir = ".cache/pytest"
testpaths = ["tests", "apps"]
pythonpath = ["."]
# A scenario passes on every driver; @web marks one that only means something in a browser
# (rendered chrome, DOM placement), skipped elsewhere.
markers = ["web: browser-only scenario — skipped by the api (and future cli) driver"]
# No pytest-cov: it starts after `-p tests.plugin` has imported `apps/`, reporting module bodies as
# missed. The Makefile runs `coverage run -m pytest`; tests/test_config.py holds it.
addopts = "-p tests.plugin --strict-config --junitxml=.cache/cov/junit.xml"
# Strict: an `xfail` that starts passing is a fix nobody noticed. A marker may set `strict=False`.
xfail_strict = true
# Deprecations are errors, the only gate that sees calls; one exception per third-party warning
# we cannot fix (none triggered by app code):
# - postgrest and storage3 warn on the timeout/verify supabase-py forwards to them;
# - supabase_auth's Timer still calls asyncio.iscoroutinefunction (removed in 3.16);
# - fastapi's TestClient re-exports starlette's, which wants httpx2;
# - gherkin (under pytest-bdd) passes `maxsplit` positionally to `re.split`, which 3.14
#   deprecated and 3.16 removes — fires at collection, on feature files with a `#` in a tag.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore:The 'timeout' parameter is deprecated:DeprecationWarning:supabase",
    "ignore:The 'verify' parameter is deprecated:DeprecationWarning:supabase",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin",
]

[tool.coverage.run]
source = ["apps"]
data_file = ".cache/cov/.coverage"
# Both lanes measure, combined by `make coverage-report`: only the browser lane renders HTML.
parallel = true
# Every route forks on `wants_json(...)`. On 3.14, branch coverage keeps the fast tracer.
branch = true
# Tests would drown the signal; dead steps are `make deadcode`'s job.
omit = ["apps/*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
# Read by `make lint`, Claude Code and Pylance alike. Beside `ty`, whose rules are still young.
# `standard`: `strict` adds mostly `Unknown` reports from untyped libraries.
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["apps", "tests", "scripts"]
# client/ (generated): on the path for scripts/smoke.py, outside `include`.
extraPaths = ["client"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "worktrees"]

[tool.ruff]
line-length = 100
target-version = "py314"
cache-dir = ".cache/ruff"
# Markdown snippets are illustrative: formatting would collapse their aligned comments and elided
# bodies. `.claude/` is copied in, not this project's source.
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
# `extend-select`: `select` would replace the defaults. Whole families, since the defaults hold
# only part of each.
extend-select = [
    "A",
    "ARG",  # dead code: arguments nobody reads
    "B",
    "C4",
    "C90",  # complexity
    "DTZ",  # a naive `datetime` is the machine deciding — the suite pins its own dates
    "E",
    "ERA",  # dead code: commented-out code
    "F",
    "FBT",  # a boolean a caller passes positionally says nothing at the call site
    "FURB",
    "I",
    "N",
    "PERF",
    "PGH",  # a suppression names its rule — no blanket `# noqa` / `# type: ignore`
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",  # a stray `print` bypasses structlog
    "TID",
    "UP",
    "W",
]
ignore = [
    "A001",    # `next` and `type` are query-param and provider-API names, not our choice
    "A002",
    # Each blind catch logs and carries on (loops, `/health`, auth hiding the provider's error);
    # tests/meta/test_capture_sites holds them.
    "BLE001",
    "B008",    # FastAPI Depends() in function signatures is intentional
    "N818",    # our business ValueErrors read fine without an `Error` suffix
    "PLR2004", # a literal in a comparison is usually clearer than a named constant
    "S101",    # in app code it narrows a type for `ty`, with the reason written above it
    # `default=lambda: clock.now()` looks the attribute up per call, so the test clock patch
    # reaches it; `default=clock.now` would bind the original.
    "PLW0108",
    # Module singletons set by their initializer: the mailer, the test clock's instant.
    "PLW0603",
    # Explicit re-export (`X as X`), which `contract/` packages rely on.
    "PLC0414",
]

# Wanted characters, listed so RUF001-003 stay on: `×` for dimensions, `–` the en dash.
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# A provider keeps the registry's signature, read or not.
"apps/*/contract/*.py" = ["ARG001"]
# `@declared_attr` passes the class.
"apps/shared/persistence/base.py" = ["N805"]
# The claim query interpolates a module constant, `_VISIBILITY_TIMEOUT_SECONDS`, never input.
"apps/shared/queue.py" = ["S608"]
# Dev CLIs: stdout is their output, they call `docker`/`supabase` by name, hold local-only
# credentials, and `provision_schema.py` validates its schema name before interpolating it.
"scripts/**" = ["S105", "S106", "S603", "S607", "S608", "T201"]
# Runs the repo's own hook commands under `dash`: the subject under test, not input.
"tests/meta/test_agent_guard.py" = ["S603", "S607"]
# `make -n` on targets hardcoded in the test.
"tests/test_makefile.py" = ["S603", "S607"]
# `ty check` on a script the test writes itself.
"apps/timeline/tests/test_grain_type.py" = ["S603"]
# A handler's parameters are its HTTP contract, read by FastAPI off the signature.
"**/*router.py" = [
    # A `Depends` guard is there for its effect.
    "ARG001",
    "PLR0913",
    "PLR0917",
]
# `dict(rows)` on SQLAlchemy rows fails `ty`; the comprehension type-checks.
"apps/shared/events/repository.py" = ["C416"]
"apps/shared/settings/store.py" = ["C416"]
"apps/shared/settings/live.py" = ["C416"]
# PIE807's `dict` for `lambda: {}` breaks a FastAPI endpoint: a builtin has no signature.
"apps/shared/tests/test_request_logging.py" = ["PIE807"]
# SQLAlchemy event listeners take a fixed signature.
"apps/shared/persistence/sql_stats.py" = ["ARG001"]
"**/tests/**" = [
    "ARG001", # fixture requested for its side effect only
    "ARG002",
    "ARG005",
    "PLC0415", # an import deferred into a test body, to pin what it loads
    "S101",    # asserting is the point
    "S105",    # the suite's own throwaway credentials and fake tokens
    "S106",
    "S608",   # test SQL built from literals to seed and inspect fixtures
    "SLF001", # a test inspects the internals of what it verifies
]

[tool.ruff.lint.pylint]
# `max-positional-args` is the guard (an unlabelled positional is unreadable); `max-args` counts
# labelled keyword-only ones too. Both at today's worst outside routers, to ratchet down.
max-positional-args = 7
max-args = 10

# The architecture contracts (AGENTS: demo apps are disposable, the others loosely coupled).
# Tests are exempt from the internals contracts: suites reuse each other's `given_helpers`.
[tool.importlinter]
root_packages = ["apps"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "domain never imports infra"
type = "forbidden"
source_modules = ["apps.*.domain"]
forbidden_modules = ["apps.*.infra"]
# direct imports only: contract/ wraps infra
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "shared imports no bounded context"
type = "forbidden"
# direct imports only: shared's tests may import apps.main
allow_indirect_imports = true
source_modules = ["apps.shared"]
forbidden_modules = [
    "apps.api_keys",
    "apps.auth",
    "apps.issues",
    "apps.calendar",
    "apps.console",
    "apps.files",
    "apps.health",
    "apps.learning",
    "apps.metrics",
    "apps.organizations",
    "apps.pages",
    "apps.profile",
    "apps.public",
    "apps.tasks",
    "apps.timeline",
    "apps.todo",
]

# ── shared's own subsystems ───────────────────────────────────────────────────
# Edges that must never appear, rather than a `layers` order: `settings.env` and
# `logs.dependency` are read across the layers. Direct imports only.

[[tool.importlinter.contracts]]
name = "the journal does not depend on the log sink"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.shared.events"]
forbidden_modules = ["apps.shared.logs"]
# Events read only the loop verdict (the listener is a loop); a fact's path must not trace itself.
ignore_imports = ["apps.shared.events.listener -> apps.shared.logs.loop"]

[[tool.importlinter.contracts]]
name = "the log sink does not depend on the journal, nor on the queue"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.shared.logs"]
# A trace never becomes a fact; and the queue logs, so a drain enqueuing would feed itself.
forbidden_modules = ["apps.shared.events", "apps.shared.queue"]

[[tool.importlinter.contracts]]
name = "persistence is the floor: it imports no subsystem built on it"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.shared.persistence"]
# Persistence is what the others build on (hence `sql_stats` lives there).
forbidden_modules = ["apps.shared.logs", "apps.shared.events", "apps.shared.http"]

[[tool.importlinter.contracts]]
name = "the HTTP edge stays synchronous: no journal, no queue"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["apps.shared.http"]
# Recording a fact or deferring work is a handler's decision, not the HTTP edge's.
forbidden_modules = ["apps.shared.events", "apps.shared.queue"]

[[tool.importlinter.contracts]]
name = "auth is a foundation: it never imports the organizations context"
type = "forbidden"
# organizations builds on auth; auth reads its settings with get_settings, not app_settings.
source_modules = ["apps.auth"]
forbidden_modules = ["apps.organizations"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api_keys internals are private"
type = "protected"
protected_modules = ["apps.api_keys.domain", "apps.api_keys.infra"]
allowed_importers = ["apps.api_keys.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "auth internals are private"
type = "protected"
protected_modules = ["apps.auth.application", "apps.auth.domain", "apps.auth.infra"]
allowed_importers = ["apps.auth.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "calendar internals are private"
type = "protected"
protected_modules = ["apps.calendar.domain", "apps.calendar.infra"]
allowed_importers = ["apps.calendar.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "console internals are private"
type = "protected"
protected_modules = ["apps.console.domain", "apps.console.infra"]
allowed_importers = ["apps.console.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "files internals are private"
type = "protected"
protected_modules = ["apps.files.domain", "apps.files.infra"]
allowed_importers = ["apps.files.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "health internals are private"
type = "protected"
protected_modules = ["apps.health.models", "apps.health.router"]
allowed_importers = ["apps.health.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "issues internals are private"
type = "protected"
protected_modules = ["apps.issues.domain", "apps.issues.infra"]
allowed_importers = ["apps.issues.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "learning internals are private"
type = "protected"
protected_modules = ["apps.learning.domain", "apps.learning.infra"]
allowed_importers = ["apps.learning.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "timeline internals are private"
type = "protected"
protected_modules = ["apps.timeline.domain", "apps.timeline.infra"]
allowed_importers = ["apps.timeline.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "metrics internals are private"
type = "protected"
protected_modules = ["apps.metrics.domain", "apps.metrics.infra"]
allowed_importers = ["apps.metrics.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "organizations internals are private"
type = "protected"
protected_modules = ["apps.organizations.domain", "apps.organizations.infra"]
allowed_importers = ["apps.organizations.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "pages internals are private"
type = "protected"
protected_modules = ["apps.pages.domain", "apps.pages.infra"]
allowed_importers = ["apps.pages.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "profile internals are private"
type = "protected"
protected_modules = ["apps.profile.domain", "apps.profile.infra"]
allowed_importers = ["apps.profile.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "public internals are private"
type = "protected"
protected_modules = ["apps.public.infra"]
allowed_importers = ["apps.public.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "todo internals are private"
type = "protected"
protected_modules = ["apps.todo.domain", "apps.todo.infra"]
allowed_importers = ["apps.todo.**", "apps.*.tests.**"]

[[tool.importlinter.contracts]]
name = "tasks internals are private"
type = "protected"
protected_modules = ["apps.tasks.domain", "apps.tasks.infra"]
allowed_importers = ["apps.tasks.**", "apps.*.tests.**"]

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 120
# Rules that don't fit a FastAPI + HTMX + Tailwind app: H021 inline styles,
# H023 entity refs (used in aria-labels), J018 url_for (Flask/Django-only),
# H030 meta description (an SEO hint).
ignore = "H021,H023,J018,H030"

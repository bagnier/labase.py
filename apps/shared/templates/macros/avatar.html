{# The initials avatar; size, colour and shape vary by caller. Photo avatars are plain <img>
   in their templates. #}
{% macro avatar(name, size='w-8', color='bg-primary/20 text-primary', text_class='text-xs font-semibold', shape='rounded-full') %}
  <div class="avatar avatar-placeholder">
    <div class="{{ size }} {{ shape }} {{ color }}">
      <span class="{{ text_class }}">{{ name | first | upper }}</span>
    </div>
  </div>
{% endmacro %}

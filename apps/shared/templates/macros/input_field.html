{% macro input_field(id, name, type="text", label="", placeholder="", value="", disabled=false, required=false, hint="") %}
<div>
  {% if label %}
  <label class="block text-xs font-medium text-gray-700 mb-1.5" for="{{ id }}">{{ label }}</label>
  {% endif %}
  <input id="{{ id }}" name="{{ name }}" type="{{ type }}"
         {% if value %}value="{{ value }}"{% endif %}
         {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
         {% if disabled %}disabled{% endif %}
         {% if required %}required{% endif %}
         class="input font-mono {% if disabled %}opacity-60 cursor-not-allowed{% endif %}" />
  {% if hint %}
  <p class="meta-text mt-1">{{ hint }}</p>
  {% endif %}
</div>
{% endmacro %}

{% macro metric_card(label, color, icon) %}
{% set bg   = {'indigo': 'bg-indigo-50',  'emerald': 'bg-emerald-50', 'amber': 'bg-amber-50'} %}
{% set text = {'indigo': 'text-indigo-500','emerald': 'text-emerald-500','amber': 'text-amber-500'} %}
<div class="card">
  <div class="flex items-center justify-between mb-3">
    <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">{{ label }}</p>
    <div class="w-7 h-7 rounded-lg {{ bg[color] }} flex items-center justify-center">
      <i class="ph ph-{{ icon }} ph-sm {{ text[color] }}" aria-hidden="true"></i>
    </div>
  </div>
  <p class="text-2xl font-bold text-gray-900">—</p>
  <p class="meta-text mt-1">No data yet</p>
</div>
{% endmacro %}

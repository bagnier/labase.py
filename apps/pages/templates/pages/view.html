{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block breadcrumb %}
<li><a href="/{{ org_handle }}/dashboard">{{ org.name }}</a></li>
<li><a href="/{{ org_handle }}/pages">Pages</a></li>
<li class="truncate max-w-48">{{ page.title }}</li>
{% endblock %}

{% block content %}
<div class="flex gap-8 items-start">

  <article class="flex-1 min-w-0 max-w-2xl space-y-6">
    <div class="flex items-center justify-between gap-4">
      <h1 class="text-lg font-semibold">{{ page.title }}</h1>
      {% if can_edit %}
      <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit" class="btn btn-sm flex-none">
        <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
        Edit
      </a>
      {% endif %}
    </div>
    <div class="card bg-base-100 border border-base-300 shadow-sm">
      <div class="card-body">
        <div class="md-body">{{ body | safe }}</div>
      </div>
    </div>
  </article>

</div>
{% endblock %}

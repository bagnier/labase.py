{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block breadcrumb %}
<a href="/{{ org_handle }}/dashboard" class="hover:text-gray-700 transition-colors">{{ org.name }}</a>
<span class="mx-1 text-gray-300">/</span>
<a href="/{{ org_handle }}/pages" class="hover:text-gray-700 transition-colors">Pages</a>
<span class="mx-1 text-gray-300">/</span>
<span class="text-gray-700 truncate max-w-48">{{ page.title }}</span>
{% endblock %}

{% block content %}
<div class="flex gap-8 items-start">

  <article class="flex-1 min-w-0 max-w-2xl space-y-6">
    <div class="flex items-center justify-between gap-4">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if can_edit %}
      <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit" class="btn-secondary btn-sm flex-none">
        <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
        Edit
      </a>
      {% endif %}
    </div>
    <div class="card">
      <div class="md-body">{{ body | safe }}</div>
    </div>
  </article>

</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block breadcrumb %}
<a href="/{{ org_handle }}/dashboard" class="hover:text-gray-700 transition-colors">{{ org_handle }}</a>
<i class="ph ph-caret-down ph-4 -rotate-90" aria-hidden="true"></i>
<a href="/{{ org_handle }}/pages" class="hover:text-gray-700 transition-colors">Pages</a>
<i class="ph ph-caret-down ph-4 -rotate-90" aria-hidden="true"></i>
<span class="text-gray-700 truncate max-w-48">{{ page.title }}</span>
{% endblock %}

{% block content %}
<article class="max-w-3xl space-y-4">
  <div class="flex items-center justify-between gap-4">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if can_edit %}
    <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit" class="btn-secondary btn-sm flex-none">
      <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
      Edit
    </a>
    {% endif %}
  </div>
  <div class="card">
    <div class="md-body">{{ body | safe }}</div>
  </div>
</article>
{% endblock %}

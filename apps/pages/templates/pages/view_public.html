<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="{{ app_theme() }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} — {{ org.name }}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css" />
  </head>
  <body class="h-full bg-base-200 text-base-content antialiased">
    <header class="h-14 bg-base-100 border-b border-base-300 flex items-center px-6 gap-4">
      <a href="/{{ org_handle }}/pages"
         class="flex items-center gap-2 flex-none hover:opacity-80 transition-opacity">
        <div class="w-6 h-6 rounded-md bg-primary text-primary-content flex items-center justify-center">
          <i class="ph ph-lightning ph-4" aria-hidden="true"></i>
        </div>
        <span class="font-semibold text-sm">{{ org.name }}</span>
      </a>
    </header>
    <main class="px-8 py-10 max-w-2xl min-h-[calc(100vh-3.5rem)]">
      <article class="space-y-6">
        <div class="flex items-start justify-between gap-4">
          <h1 class="text-2xl font-semibold">{{ page.title }}</h1>
          {% if can_edit %}
            <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit"
               class="btn btn-sm flex-none">
              <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
              Edit
            </a>
          {% endif %}
        </div>
        <div class="card bg-base-100 border border-base-300 shadow-sm">
          <div class="card-body">
            <div class="md-body">{{ body | safe }}</div>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — {{ org.name }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased">
  <header class="h-14 bg-white border-b border-gray-200 flex items-center px-6 gap-4">
    <a href="/{{ org_handle }}/pages" class="flex items-center gap-2 flex-none hover:opacity-80 transition-opacity">
      <div class="w-6 h-6 rounded-md bg-indigo-500 flex items-center justify-center">
        <i class="ph ph-lightning ph-4 text-white" aria-hidden="true"></i>
      </div>
      <span class="font-semibold text-gray-900 text-sm">{{ org.name }}</span>
    </a>
  </header>

  <div class="flex min-h-[calc(100vh-3.5rem)]">
    {% if page_nav %}
    <nav aria-label="Page navigation"
         class="w-52 bg-white border-r border-gray-200 py-4 flex-none">
      {% for link in page_nav %}
      <a href="/{{ org_handle }}/pages/{{ link.slug }}"
         class="flex items-center gap-2 px-4 py-2 text-sm
                {% if link.slug == page.slug %}text-indigo-600 font-medium bg-indigo-50{% else %}text-gray-600 hover:bg-gray-50{% endif %}
                transition-colors">
        <i class="ph ph-file-text ph-sm flex-none" aria-hidden="true"></i>
        {{ link.title }}
      </a>
      {% endfor %}
    </nav>
    {% endif %}

    <main class="flex-1 px-8 py-10 max-w-2xl">
      <div class="flex items-start justify-between gap-4 mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">{{ page.title }}</h1>
        {% if can_edit %}
        <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit" class="btn-secondary btn-sm flex-none">
          <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
          Edit
        </a>
        {% endif %}
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <div class="md-body">{{ body | safe }}</div>
      </div>
    </main>
  </div>
</body>
</html>

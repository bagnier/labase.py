<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased">
  <header class="h-14 bg-white border-b border-gray-200 flex items-center px-6 gap-4">
    <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-gray-500">
      <a href="/" class="flex items-center gap-2 flex-none hover:text-gray-700 transition-colors">
        <div class="w-6 h-6 rounded-md bg-indigo-500 flex items-center justify-center">
          <i class="ph ph-lightning ph-4 text-white" aria-hidden="true"></i>
        </div>
        <span class="font-semibold text-gray-900">labase</span>
      </a>
      <span class="mx-1 text-gray-300">/</span>
      <a href="/{{ org_handle }}/pages" class="hover:text-gray-700 transition-colors truncate">
        Pages
      </a>
    </nav>
  </header>
  <main class="max-w-2xl mx-auto px-6 py-10">
    <div class="flex items-start justify-between gap-4 mb-6">
      <h1 class="text-2xl font-semibold text-gray-900">{{ page.title }}</h1>
      {% if can_edit %}
      <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit" class="btn-secondary btn-sm flex-none">
        <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
        Edit
      </a>
      {% endif %}
    </div>
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="md-body">{{ body | safe }}</div>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased">
  <header class="h-14 bg-white border-b border-gray-200 flex items-center px-6 gap-4">
    <a href="/" class="flex items-center gap-2 flex-none">
      <div class="w-6 h-6 rounded-md bg-indigo-500 flex items-center justify-center">
        <i class="ph ph-lightning ph-4 text-white" aria-hidden="true"></i>
      </div>
      <span class="text-sm font-semibold text-gray-900">labase</span>
    </a>
    <i class="ph ph-caret-down ph-4 -rotate-90 text-gray-300" aria-hidden="true"></i>
    <a href="/{{ org_handle }}/pages" class="text-sm text-gray-500 hover:text-gray-700 transition-colors truncate">
      Pages
    </a>
  </header>
  <main class="max-w-3xl mx-auto px-6 py-10">
    <div class="flex items-start justify-between gap-4 mb-6">
      <h1 class="text-2xl font-semibold text-gray-900">{{ page.title }}</h1>
      {% if can_edit %}
      <a href="/{{ org_handle }}/pages/{{ page.slug }}/edit"
         class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 hover:bg-gray-50 transition-colors flex-none shadow-sm">
        <i class="ph ph-pencil ph-4" aria-hidden="true"></i>
        Edit
      </a>
      {% endif %}
    </div>
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="md-body">{{ body | safe }}</div>
    </div>
  </main>
</body>
</html>

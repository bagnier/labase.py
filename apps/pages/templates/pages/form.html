{% extends "base.html" %}

{% block title %}Edit {{ page.title }} — labase{% endblock %}

{% block breadcrumb %}
  <a href="/{{ org_handle }}/dashboard" class="hover:text-gray-700">{{ org.name }}</a>
  <span class="mx-1 text-gray-300">/</span>
  <a href="/{{ org_handle }}/pages" class="hover:text-gray-700">Pages</a>
  <span class="mx-1 text-gray-300">/</span>
  <span class="text-gray-700">{{ page.title }}</span>
{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">
  <h1 class="page-title">Edit page</h1>

  <form id="edit-page-form" class="space-y-4 card"
        hx-patch="/{{ org_handle }}/pages/{{ page.slug }}" hx-swap="none">
    <div>
      <label for="page-title" class="block text-xs font-medium text-gray-700 mb-1.5">Title</label>
      <input id="page-title" type="text" name="title" value="{{ page.title }}" class="input" />
    </div>
    <div>
      <label for="page-slug" class="block text-xs font-medium text-gray-700 mb-1.5">Slug</label>
      <input id="page-slug" type="text" name="slug" value="{{ page.slug }}" class="input" />
    </div>
    <div>
      <label for="page-content" class="block text-xs font-medium text-gray-700 mb-1.5">Content (Markdown)</label>
      <div class="w-full" id="editor-mount">
        <textarea id="page-content" name="content" class="input" rows="10">{{ page.content }}</textarea>
      </div>
    </div>
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-3">
        <button type="submit" class="btn-primary">Save</button>
        {% if is_owner %}
        <select name="visibility" class="input !w-auto" aria-label="Visibility">
          <option value="draft" {% if page.visibility == 'draft' %}selected{% endif %}>Draft</option>
          <option value="members" {% if page.visibility == 'members' %}selected{% endif %}>Members</option>
          <option value="public" {% if page.visibility == 'public' %}selected{% endif %}>Public</option>
        </select>
        {% endif %}
      </div>
      <button type="button" id="delete-page-btn"
              class="text-sm text-red-600 hover:text-red-800 font-medium"
              aria-label="Delete page {{ page.title }}"
              hx-delete="/{{ org_handle }}/pages/{{ page.slug }}"
              hx-confirm="Delete &ldquo;{{ page.title }}&rdquo;? This cannot be undone."
              hx-swap="none">
        Delete page
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/codemirror-editor.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const textarea = document.querySelector('#editor-mount textarea[name="content"]')
    if (textarea) initMarkdownEditor(textarea)
  })
</script>
{% endblock %}

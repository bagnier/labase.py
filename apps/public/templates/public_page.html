<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — {{ org.name }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased">
  <header class="h-14 bg-white border-b border-gray-200 flex items-center px-6 gap-6">
    <a href="/" class="flex items-center gap-2 flex-none hover:opacity-80 transition-opacity">
      <div class="w-6 h-6 rounded-md bg-indigo-500 flex items-center justify-center">
        <i class="ph ph-lightning ph-4 text-white" aria-hidden="true"></i>
      </div>
      <span class="font-semibold text-gray-900 text-sm">{{ org.name }}</span>
    </a>

    {% if page_nav %}
    <nav aria-label="Site navigation" class="flex items-center gap-1 flex-1">
      {% for link in page_nav %}
      <a href="/{{ link.slug }}"
         class="px-3 py-1.5 text-sm
                {% if link.slug == page.slug %}text-indigo-600 font-medium{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endif %}
                rounded-md transition-colors">
        {{ link.title }}
      </a>
      {% endfor %}
    </nav>
    {% else %}
    <div class="flex-1"></div>
    {% endif %}

    <div class="flex items-center gap-2 flex-none">
      <a href="/auth/login" class="btn-secondary btn-sm">Sign in</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">{{ page.title }}</h1>
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="md-body">{{ body | safe }}</div>
    </div>
  </main>
</body>
</html>

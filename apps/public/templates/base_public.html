<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="{{ app_theme() }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}labase{% endblock %}</title>
    <link rel="stylesheet" href="{{ asset('/static/css/tailwind.css') }}" />
    <meta name="htmx-config"
          content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":false}]}' />
    <script src="{{ asset('/static/js/htmx.min.js') }}" defer></script>
    <script src="{{ asset('/static/js/alpine.min.js') }}" defer></script>
  </head>
  <body class="h-full bg-base-200 text-base-content antialiased flex flex-col min-h-screen">
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 btn btn-primary btn-sm">
      Skip to content
    </a>
    <header class="navbar min-h-14 px-4">
      <div class="flex-1">
        <a href="/" class="flex items-center gap-2.5">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-primary-content">
            <i class="ph ph-lightning ph-md" aria-hidden="true"></i>
          </div>
          <span class="text-xl font-semibold tracking-tight">labase</span>
        </a>
      </div>
    </header>
    <main id="main-content"
          tabindex="-1"
          class="flex-1 flex items-center justify-center px-4 py-8">
      <div class="w-full max-w-sm">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>

<section class="card" data-overview="{{ o.key }}">
  <div class="flex items-center gap-3 mb-3">
    <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center flex-none">
      <i class="ph ph-{{ o.icon }} text-indigo-500" aria-hidden="true"></i>
    </div>
    <h3 class="section-title">{{ o.title }}</h3>
  </div>
  <div class="flex flex-wrap gap-2 mb-2">
    {% for line in o.data.lines %}
      <span class="text-xs font-semibold bg-gray-100 text-gray-600 rounded px-2 py-0.5">{{ line }}</span>
    {% endfor %}
  </div>
  {% if o.data.recent %}
    <ul class="text-sm text-gray-500 space-y-0.5">
      {% for item in o.data.recent %}<li class="truncate">{{ item }}</li>{% endfor %}
    </ul>
  {% endif %}
  <a href="/{{ org_handle }}/{{ o.href }}" class="inline-block mt-3 text-sm font-medium text-indigo-600 hover:text-indigo-800">Open →</a>
</section>

{# Swapped in whole by the toolbar and "Load older", so day groups stay right. #}
{% from "macros/activity_feed.html" import activity_feed %}
<div id="activity-feed">
  {{ activity_feed(activity_groups, empty="No activity matches — try another search or range.") }}
  {% if activity_has_more %}
    <button type="button"
            class="btn btn-block btn-ghost btn-sm mt-4"
            hx-get="/profile/activity?limit={{ activity_next_limit }}{{ activity_query }}"
            hx-target="#activity-feed"
            hx-swap="outerHTML">Load older activity</button>
  {% endif %}
</div>

<div style="font-family: sans-serif; max-width: 32rem; margin: 0 auto">
  <h1 style="font-size: 1.25rem">You have been invited to join {{ org_name }}</h1>
  <p>
    <a href="{{ link }}"
       style="display: inline-block;
              padding: 0.5rem 1rem;
              background: #1d4ed8;
              color: #fff;
              border-radius: 0.375rem;
              text-decoration: none">Accept the invitation</a>
  </p>
  <p style="font-size: 0.875rem; color: #555">
    Or open this link: <a href="{{ link }}">{{ link }}</a>
  </p>
  <p style="font-size: 0.875rem; color: #555">If you were not expecting this invitation, you can ignore this email.</p>
</div>

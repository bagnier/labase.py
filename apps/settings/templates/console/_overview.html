<section class="card bg-base-100 border border-base-300 shadow-sm"
         data-overview-key="{{ o.key }}">
  <div class="card-body">
    <div class="flex items-center justify-between">
      <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center flex-none">
        <i class="ph ph-{{ o.icon }} text-primary" aria-hidden="true"></i>
      </div>
      {% if disabled is defined and o.key in disabled %}
        <span class="badge badge-error badge-sm">Disabled</span>
      {% else %}
        <span class="text-xs opacity-60">all organisations</span>
      {% endif %}
    </div>
    <h3 class="card-title text-sm font-semibold mt-3">{{ o.title }}</h3>
    <div class="flex flex-wrap gap-2 mt-2">
      {% for line in o.data.lines %}
        <span class="badge badge-ghost badge-sm">{{ line }}</span>
      {% endfor %}
    </div>
  </div>
</section>

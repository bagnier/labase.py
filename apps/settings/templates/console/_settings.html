<div class="settings card !p-0 divide-y divide-gray-100" id="settings">
  {% for s in settings %}
    <form class="grid grid-cols-1 sm:grid-cols-[1fr_220px_90px] gap-4 items-center p-4"
          data-setting-key="{{ s.key }}" data-setting-type="{{ s.type }}"
          hx-put="/console/{{ app }}/settings/{{ s.key }}" hx-target="#settings" hx-swap="outerHTML"
          hx-trigger="change">
      <div>
        <span class="font-mono text-xs font-semibold">{{ s.key }}</span>
        <div class="text-xs text-gray-500 mt-0.5">{{ s.label }}</div>
      </div>
      {% if s.type == "boolean" %}
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input type="hidden" name="value" value="false" />
          <input type="checkbox" name="value" value="true" class="switch sr-only peer"
                 {% if s.value == "true" %}checked{% endif %} />
          <span class="switch-track"></span>
          <span class="text-sm text-gray-600">Enabled</span>
        </label>
      {% else %}
        <input type="{{ 'number' if s.type == 'number' else 'text' }}" name="value"
               value="{{ s.value }}" class="input" />
      {% endif %}
      <div class="text-right">
        {% if saved_key == s.key %}
          <span class="saved-flash text-xs font-medium text-green-600">Saved ✓</span>
        {% endif %}
      </div>
    </form>
  {% endfor %}
</div>
